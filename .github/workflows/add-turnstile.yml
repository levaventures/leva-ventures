name: Add Turnstile Protection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-turnstile.yml'
permissions:
  contents: write
jobs:
  integrate-turnstile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Turnstile to contact form
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_csp = "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; connect-src 'self' https://formspree.io; form-action https://formspree.io; frame-src 'none'; worker-src 'none'; upgrade-insecure-requests"
          new_csp = "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://formspree.io https://challenges.cloudflare.com; form-action https://formspree.io; frame-src https://challenges.cloudflare.com; worker-src 'none'; upgrade-insecure-requests"
          if old_csp in s:
              s = s.replace(old_csp, new_csp, 1)
          elif new_csp not in s:
              raise SystemExit('Expected CSP not found')

          note = '<p class="form-note"><strong>For your security:</strong> Please do not submit Social Security numbers, bank account numbers, passwords, tax identification numbers, government ID numbers, or other highly sensitive personal information through this form.</p>'
          widget = '<div class="turnstile-wrap"><div class="cf-turnstile" data-sitekey="0x4AAAAAAE0cfjc5oTJPXAXE" data-theme="dark" data-size="flexible"></div></div>\n      '
          if 'class="cf-turnstile"' not in s:
              if note not in s:
                  raise SystemExit('Security note marker not found')
              s = s.replace(note, widget + note, 1)

          local_script = '<script src="/assets/leva-site.js" defer></script>'
          turnstile_script = '<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>\n'
          if turnstile_script.strip() not in s:
              if local_script not in s:
                  raise SystemExit('Local script marker not found')
              s = s.replace(local_script, turnstile_script + local_script, 1)

          style_marker = '.submission-success {'
          turnstile_css = '''.turnstile-wrap {
  margin: 18px 0 12px;
  min-height: 65px;
  display: flex;
  align-items: center;
}

'''
          if '.turnstile-wrap {' not in s:
              if style_marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(style_marker, turnstile_css + style_marker, 1)

          p.write_text(s, encoding='utf-8')

          js = Path('assets/leva-site.js')
          j = js.read_text(encoding='utf-8')
          submit_marker = "    const honeypot = form.querySelector('input[name=\"_gotcha\"]');\n    if (honeypot && honeypot.value) return;\n"
          token_check = submit_marker + '''\n    const turnstileToken = form.querySelector('[name="cf-turnstile-response"]');\n    if (!turnstileToken || !turnstileToken.value) {\n      window.alert('Please complete the security verification before submitting.');\n      return;\n    }\n'''
          if "cf-turnstile-response" not in j:
              if submit_marker not in j:
                  raise SystemExit('JS submit marker not found')
              j = j.replace(submit_marker, token_check, 1)

          catch_marker = "      window.alert(message);\n"
          reset_code = catch_marker + "      if (window.turnstile && form.querySelector('.cf-turnstile')) window.turnstile.reset();\n"
          if "window.turnstile.reset()" not in j:
              if catch_marker not in j:
                  raise SystemExit('JS catch marker not found')
              j = j.replace(catch_marker, reset_code, 1)

          js.write_text(j, encoding='utf-8')
          PY
      - name: Verify Turnstile integration
        shell: bash
        run: |
          set -e
          grep -q '0x4AAAAAAE0cfjc5oTJPXAXE' index.html
          grep -q 'challenges.cloudflare.com/turnstile/v0/api.js' index.html
          grep -q "frame-src https://challenges.cloudflare.com" index.html
          grep -q 'cf-turnstile-response' assets/leva-site.js
      - name: Commit Turnstile integration
        shell: bash
        run: |
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add index.html assets/leva-site.js
          git diff --cached --quiet || git commit -m "Add Cloudflare Turnstile protection to contact form"
          git push
