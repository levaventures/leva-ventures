name: Add Referral Fields
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch form
        shell: bash
        run: |
          B64=''
          export B64
          python3 -c 'from pathlib import Path; import os,base64; p=Path("index.html"); s=p.read_text(); marker="        <div class=\"field\">\n          <label for=\"phone\">Phone</label>\n          <input id=\"phone\" name=\"phone\" type=\"tel\" placeholder=\"Phone number\">\n        </div>\n"; snippet=base64.b64decode(os.environ["B64"]).decode(); assert marker in s; s=s if "id=\"referral_source\"" in s else s.replace(marker,marker+snippet,1); p.write_text(s)'
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add referral tracking fields to contact form"
          git push
