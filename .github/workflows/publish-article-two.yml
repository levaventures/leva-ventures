name: Publish Article Two

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-article-two.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish article and links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          url = "/insights/how-to-finance-investment-property-private-capital/"
          full_url = "https://levaventures.com" + url

          # Article 2
          p = Path("insights/how-to-finance-investment-property-private-capital/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace('<meta name="robots" content="noindex,nofollow">\n', '', 1)
          s = s.replace('<div class="preview-note">Article #2 preview · not yet indexed or linked from Insights</div>\n', '', 1)
          s = s.replace('<td>Business-purpose rental loan</td>', '<td>DSCR / business-purpose rental loan</td>', 1)
          p.write_text(s, encoding="utf-8")

          # Insights hub
          p = Path("insights/index.html")
          s = p.read_text(encoding="utf-8")
          target = '<div class="article-status">Planned Insight</div>'
          title = 'How to Finance an Investment Property When Traditional Financing Is Not the Right Fit'
          pos = s.find(title)
          if pos < 0:
              raise SystemExit("Article 2 title not found")
          status_pos = s.find(target, pos)
          if status_pos < 0:
              raise SystemExit("Article 2 status not found")
          button = '<a class="btn" href="' + url + '" style="margin-top:auto;align-self:flex-start;">Read Article</a>'
          s = s[:status_pos] + button + s[status_pos + len(target):]
          p.write_text(s, encoding="utf-8")

          # Article 1 reciprocal internal link
          p = Path("insights/how-to-prepare-real-estate-opportunity-private-capital/index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<p>Investment-property and business-purpose transactions may be analyzed under a different framework, but they still require clear documentation of the property, borrower or sponsor, capital request, repayment strategy, and economics.</p>'
          if url not in s:
              extra = marker + '\n\n      <div class="callout">\n        <div class="eyebrow">Related Leva Insight</div>\n        <p>For a deeper look at bridge, rental, value-add, and other investment-property structures, read <a href="' + url + '" style="color:#e0c27a;border-bottom:1px solid rgba(199,161,90,.4);">How to Finance an Investment Property When Traditional Financing Isn\'t the Right Fit</a>.</p>\n      </div>'
              if marker not in s:
                  raise SystemExit("Article 1 link marker not found")
              s = s.replace(marker, extra, 1)
              p.write_text(s, encoding="utf-8")

          # Sitemap
          p = Path("sitemap.xml")
          s = p.read_text(encoding="utf-8")
          if full_url not in s:
              entry = "\n  <url>\n    <loc>" + full_url + "</loc>\n    <lastmod>2026-08-26</lastmod>\n  </url>\n"
              s = s.replace("\n</urlset>", entry + "\n</urlset>")
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit publication
        shell: bash
        run: |
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add insights/index.html insights/how-to-prepare-real-estate-opportunity-private-capital/index.html insights/how-to-finance-investment-property-private-capital/index.html sitemap.xml
          git commit -m "Publish second Leva Insights article"
          git push
