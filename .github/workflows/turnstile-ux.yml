name: Turnstile UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/turnstile-ux.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Turnstile appearance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('data-theme="dark" data-size="flexible"></div>', 'data-theme="dark" data-size="flexible" data-appearance="interaction-only"></div>', 1)
          s = s.replace('.turnstile-wrap {\n  margin: 18px 0 12px;\n  min-height: 65px;', '.turnstile-wrap {\n  margin: 0;\n  min-height: 0;', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'data-appearance="interaction-only"' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine Turnstile form experience"
          git push
