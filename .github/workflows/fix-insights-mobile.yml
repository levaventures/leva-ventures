name: Fix Insights Mobile UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-insights-mobile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix featured image and mobile navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          insights = Path('insights/index.html')
          text = insights.read_text(encoding='utf-8')

          old_visual = ".featured-visual {\n  min-height: 500px;\n  position: relative;\n  background:\n    linear-gradient(145deg, rgba(8,11,17,.15), rgba(8,11,17,.78)),\n    url('/levaventures-og-image.png') center/cover no-repeat;\n}"
          new_visual = ".featured-visual {\n  min-height: 500px;\n  position: relative;\n  background:\n    linear-gradient(145deg, rgba(8,11,17,.15), rgba(8,11,17,.78)) center/cover no-repeat,\n    url('/levaventures-og-image.png') center/contain no-repeat,\n    #0b0f16;\n}"
          text = text.replace(old_visual, new_visual, 1)

          if '.mobile-nav-link {' not in text:
              anchor = ".nav-links a:hover,\n.nav-links a.active { color: var(--gold-light); }\n"
              addition = anchor + "\n.mobile-nav-link {\n  display: none;\n  color: var(--gold-light);\n  font-size: .62rem;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  border-bottom: 1px solid rgba(199,161,90,.45);\n  padding-bottom: 4px;\n}\n"
              if anchor not in text:
                  raise SystemExit('Insights nav CSS anchor not found')
              text = text.replace(anchor, addition, 1)

          text = text.replace("@media (max-width: 760px) {\n  .nav-links { display: none; }", "@media (max-width: 760px) {\n  .nav-links { display: none; }\n  .mobile-nav-link { display: inline-flex; align-items: center; }", 1)

          nav_anchor = "    <nav class=\"nav-links\" aria-label=\"Primary navigation\">\n      <a href=\"/#services\">What We Do</a>\n      <a href=\"/#about\">About</a>\n      <a href=\"/insights/\" class=\"active\">Insights</a>\n      <a href=\"/#contact\">Contact</a>\n      <a href=\"/#contact\" class=\"btn\">Submit an Opportunity</a>\n    </nav>"
          if 'class="mobile-nav-link" href="/"' not in text:
              text = text.replace(nav_anchor, nav_anchor + "\n    <a class=\"mobile-nav-link\" href=\"/\">Home</a>", 1)

          old_mobile_visual = "  .featured-visual {\n  min-height: 240px;\n  background-size: contain;\n  background-position: center center;\n  background-repeat: no-repeat;\n  background-color: #0b0f16;\n}"
          text = text.replace(old_mobile_visual, "  .featured-visual {\n    min-height: 240px;\n  }", 1)
          insights.write_text(text, encoding='utf-8')

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')

          if '.mobile-insights-link {' not in text:
              anchor = ".nav-links a:hover { color: var(--gold-light); }\n"
              addition = anchor + "\n.mobile-insights-link {\n  display: none;\n  color: var(--gold-light);\n  font-size: .62rem;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  border-bottom: 1px solid rgba(199,161,90,.45);\n  padding-bottom: 4px;\n}\n"
              if anchor not in text:
                  raise SystemExit('Homepage nav CSS anchor not found')
              text = text.replace(anchor, addition, 1)

          text = text.replace("@media (max-width: 900px) {\n  .nav-links { display: none; }", "@media (max-width: 900px) {\n  .nav-links { display: none; }\n  .mobile-insights-link { display: inline-flex; align-items: center; }", 1)

          nav_anchor = "    <nav class=\"nav-links\">\n      <a href=\"#services\">What We Do</a>\n      <a href=\"#about\">About</a>\n      <a href=\"/insights/\">Insights</a>\n      <a href=\"#contact\">Contact</a>\n      <a class=\"btn\" href=\"#contact\">Submit an Opportunity</a>\n    </nav>"
          if 'class="mobile-insights-link"' not in text:
              if nav_anchor not in text:
                  raise SystemExit('Homepage nav markup anchor not found')
              text = text.replace(nav_anchor, nav_anchor + "\n    <a class=\"mobile-insights-link\" href=\"/insights/\">Insights</a>", 1)
          home.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add index.html insights/index.html
          git commit -m "Fix Insights featured image and mobile navigation"
          git push
