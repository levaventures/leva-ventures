name: Add Homepage Canonical
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical tag
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); marker="<meta name=\"description\" content=\"Leva Ventures, LLC connects qualified business, real estate, and investment opportunities with appropriate private capital sources.\">\n"; canonical="<link rel=\"canonical\" href=\"https://levaventures.com/\">\n"; assert marker in s; s=s if canonical in s else s.replace(marker, marker+canonical, 1); p.write_text(s, encoding="utf-8")'
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add canonical URL to homepage"
          git push
