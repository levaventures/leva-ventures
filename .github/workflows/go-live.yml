name: Launch Leva Insights

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/go-live.yml'

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish Insights and add homepage navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          insights = Path('insights/index.html')
          text = insights.read_text(encoding='utf-8')
          text = text.replace('<meta name="robots" content="noindex,nofollow">\n', '')
          text = text.replace('<div class="preview-note">Insights preview · not yet indexed or linked from the homepage</div>\n', '')
          text = re.sub(r'\n\.preview-note \{.*?\n\}\n', '\n', text, flags=re.S)
          text = re.sub(r'\n\s*\.preview-note \{ left: 12px; right: 12px; bottom: 12px; text-align: center; \}', '', text)
          insights.write_text(text, encoding='utf-8')

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          old = '''      <a href="#services">What We Do</a>\n      <a href="#about">About</a>\n      <a href="#contact">Contact</a>'''
          new = '''      <a href="#services">What We Do</a>\n      <a href="#about">About</a>\n      <a href="/insights/">Insights</a>\n      <a href="#contact">Contact</a>'''
          if old not in text and '<a href="/insights/">Insights</a>' not in text:
              raise SystemExit('Homepage navigation pattern not found; refusing unsafe edit.')
          text = text.replace(old, new, 1)
          home.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          text = sitemap.read_text(encoding='utf-8')
          if 'https://levaventures.com/insights/' not in text:
              block = '''\n  <url>\n    <loc>https://levaventures.com/insights/</loc>\n    <lastmod>2026-08-26</lastmod>\n  </url>\n'''
              text = text.replace('\n</urlset>', block + '\n</urlset>')
              sitemap.write_text(text, encoding='utf-8')

      - name: Commit launch changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add index.html insights/index.html sitemap.xml
          git commit -m "Go live with Leva Insights"
          git push
