name: Commercial Financing Calculator Tests
on:
  pull_request:
    paths:
      - 'tools/commercial-real-estate-loan-calculator/**'
      - '.github/workflows/finance-calculator-tests.yml'
      - 'previews/**'
  workflow_dispatch:
jobs:
  calculation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test financial formulas
        run: node --test tools/commercial-real-estate-loan-calculator/finance.test.js tools/commercial-real-estate-loan-calculator/strategy.test.js
      - name: Verify HTML internal targets and required assets
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const base='tools/commercial-real-estate-loan-calculator/';
          const html=fs.readFileSync(base+'index.html','utf8');
          const app=fs.readFileSync(base+'app.js','utf8')+'\n'+fs.readFileSync(base+'advanced.js','utf8')+'\n'+fs.readFileSync(base+'voice.js','utf8');
          for (const match of app.matchAll(/\$\("([^"]+)"\)/g)){
            if(!html.includes('id="'+match[1]+'"'))throw new Error('Missing HTML control '+match[1]);
          }
          for(const script of ['finance.js','strategy.js','app.js','advanced.js','voice.js'])if(!html.includes('src="./'+script+'"'))throw new Error('Missing script '+script);
          console.log('Required markup references verified');
          NODE

      - name: Install browser smoke test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Run Chromium desktop and mobile smoke tests
        run: node tools/commercial-real-estate-loan-calculator/browser.test.js

      - name: Validate standalone interactive preview
        env:
          LEVA_PREVIEW_FILE: ../../previews/leva-financing-intelligence-uk-voice-review.html
        run: node tools/commercial-real-estate-loan-calculator/browser.test.js
      - name: Capture visual preview screenshots
        run: node tools/commercial-real-estate-loan-calculator/preview-screenshots.js
      - name: Publish review bundle
        uses: actions/upload-artifact@v4
        with:
          name: leva-financing-intelligence-uk-voice-review
          path: |
            previews/leva-financing-intelligence-uk-voice-review.html
            preview-artifacts/*.png
          retention-days: 30
