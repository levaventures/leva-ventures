name: Tune Article Lead

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tune-article-lead.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adjust lead paragraph sizes
        shell: bash
        run: |
          FILE="insights/how-to-prepare-real-estate-opportunity-private-capital/index.html"
          sed -i 's/font-size: 1\.55rem;/font-size: 1.35rem;/' "$FILE"
          sed -i 's/line-height: 1\.45;/line-height: 1.5;/' "$FILE"
          sed -i 's/p:first-of-type { font-size: 1\.35rem; }/p:first-of-type { font-size: 1.2rem; }/' "$FILE"

      - name: Commit change
        shell: bash
        run: |
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add insights/how-to-prepare-real-estate-opportunity-private-capital/index.html
          git commit -m "Refine Article 1 lead paragraph typography"
          git push
