name: Auto Fill Referral N/A
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch referral behavior
        shell: bash
        run: |
          B64=''
          export B64
          python3 -c 'from pathlib import Path; import os,base64; p=Path("index.html"); s=p.read_text(); marker="</body>"; snippet=base64.b64decode(os.environ["B64"]).decode(); assert marker in s; s=s if "id=\"referral-na-behavior\"" in s else s.replace(marker,snippet+marker,1); p.write_text(s)'
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "Leva Ventures Site Automation"
          git config user.email "matt@levaventures.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-fill N/A for non-referred leads"
          git push
